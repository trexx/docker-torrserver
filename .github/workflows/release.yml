name: 'Release'

# Release button: Actions -> Release -> Run workflow. Tags TorrServer's release without the MatriX. prefix: MatriX.148 is 148.0, MatriX.146.1 is 146.1
# (or <version>-N for a rebuild of a version released before), builds and pushes the
# image, then creates the tag and GitHub release. Tick "dry run" to see the tag first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to work it out from the Dockerfile)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only work out the tag and build the image'
        type: boolean
        default: false

jobs:
  release:
    uses: 'trexx/actions/.github/workflows/release-image.yml@main'
    permissions:
      contents: 'write'
      packages: 'write'
    with:
      version_command: >-
        grep -oP '(?<=/refs/tags/MatriX\.)[0-9.]+(?=\.tar\.gz)' Dockerfile | awk -F. '{printf "%d.%d", $1, $2}'
      tag: '${{ inputs.tag }}'
      dry_run: ${{ inputs.dry_run }}
